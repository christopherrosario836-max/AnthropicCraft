<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blockland Texture Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: header bar; three columns (slot list, editor, preview). Stacks on narrow screens. */
:root{--bg:#0b100d;--panel:#131c16;--panel2:#18241c;--edge:#2f4237;--ink:#eef3e8;--dim:#9db0a0;--lime:#a6d94f;--amber:#f2b94b;--red:#e0523f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pixelify Sans",ui-monospace,Menlo,Consolas,monospace;font-size:15px}
body{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right));border-bottom:2px solid var(--edge);background:var(--panel)}
h1{margin:0;font-size:24px;letter-spacing:2px;text-transform:uppercase;color:var(--lime);text-shadow:2px 2px 0 #000}
h2{margin:0 0 6px;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--amber)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn,select{font:600 14px "Pixelify Sans",ui-monospace,monospace;color:var(--ink);background:#2b3b2f;border:2px solid #000;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.12);padding:7px 11px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:#38503d}
button.on{background:#4d7a22}
button.go{background:#4d7a22}
button:focus-visible,input:focus-visible,.btn:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
main{flex:1;display:grid;grid-template-columns:260px minmax(0,1fr) 270px;gap:14px;padding:14px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right))}
section{background:var(--panel);border:2px solid var(--edge);padding:12px;min-width:0}
#side{max-height:calc(100vh - 100px);overflow-y:auto;position:sticky;top:10px;align-self:start}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}
.cat{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:12px 0 4px}
.slotbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:4px 6px;margin:0 0 3px;background:var(--panel2);border:2px solid transparent;box-shadow:none;text-transform:none;letter-spacing:0;font-weight:400}
.slotbtn.sel{border-color:var(--amber)}
.slotbtn canvas{width:32px;height:32px;image-rendering:pixelated;background:repeating-conic-gradient(#222 0 25%,#333 0 50%) 0 0/8px 8px;flex:none}
.slotbtn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.slotbtn i{width:8px;height:8px;background:var(--lime);display:none;flex:none}
.slotbtn.mod i{display:block}
#stage{display:flex;flex-direction:column;gap:10px}
#view{max-width:100%;overflow:auto;border:2px solid #000;background:#000;align-self:flex-start}
#view canvas{display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}
.swatches{display:flex;flex-wrap:wrap;gap:4px}
.sw{width:24px;height:24px;border:2px solid #000;padding:0;box-shadow:none;background-clip:padding-box}
.sw.sel{outline:2px solid var(--amber)}
input[type=color]{width:42px;height:34px;padding:0;border:2px solid #000;background:none;cursor:pointer}
input[type=range]{accent-color:var(--lime);width:110px}
label.opt{display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--dim)}
.pv{display:flex;flex-direction:column;gap:12px}
.pv canvas{image-rendering:pixelated;background:repeating-conic-gradient(#222 0 25%,#333 0 50%) 0 0/8px 8px;border:2px solid #000;max-width:100%}
.hint{color:var(--dim);font-size:13px;line-height:1.4;margin:0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel2);border:2px solid var(--edge);padding:8px 14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
@media (max-width:980px){main{grid-template-columns:1fr}#side{position:static;max-height:260px}}
</style>
</head>
<body>
<header>
  <div><h1>Blockland Texture Lab</h1><p class="hint">Paint blocks, items and mob skins. Export a pack the game can load.</p></div>
  <div class="row">
    <button id="btnImport">Import</button>
    <button id="btnExport" class="go">Export pack (.zip)</button>
    <label class="opt"><input type="checkbox" id="optAll"> include unchanged</label>
    <a class="btn" href="./">Open the game</a>
  </div>
  <input type="file" id="fileImport" accept="image/png,.zip" multiple hidden>
  <input type="file" id="fileSlot" accept="image/png" hidden>
</header>
<main>
  <section id="side">
    <div class="tabs"><button id="tabBlocks" class="on">Blocks and items</button><button id="tabMobs">Mobs</button></div>
    <div id="list"></div>
  </section>
  <section id="stage">
    <div class="row" style="justify-content:space-between"><h2 id="slotTitle">Texture</h2><span class="hint" id="slotInfo"></span></div>
    <div class="row" id="tools">
      <button data-tool="pencil" class="on">Pencil</button><button data-tool="eraser">Eraser</button><button data-tool="fill">Fill</button><button data-tool="pick">Pick</button>
      <label class="opt"><input type="checkbox" id="optMirror"> mirror</label>
      <button id="btnUndo">Undo</button>
    </div>
    <div id="view"><canvas id="cv"></canvas></div>
    <div class="row">
      <input type="color" id="col" value="#7cbd4a" aria-label="Paint colour">
      <label class="opt">alpha <input type="range" id="alpha" min="0" max="100" value="100"></label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="row">
      <button id="btnFlipH">Flip H</button><button id="btnFlipV">Flip V</button>
      <button id="btnL">&larr;</button><button id="btnR">&rarr;</button><button id="btnU">&uarr;</button><button id="btnD">&darr;</button>
      <button id="btnClear">Clear</button><button id="btnReset">Reset slot</button>
      <button id="btnLoadSlot">Load PNG</button><button id="btnSaveSlot">Save PNG</button>
      <label class="opt" id="tintRow"><input type="checkbox" id="optTint" checked> show tint</label>
      <label class="opt" id="guideRow" hidden><input type="checkbox" id="optGuide" checked> show layout guide</label>
    </div>
  </section>
  <section class="pv">
    <div><h2>Preview</h2><canvas id="pvOne" width="96" height="96"></canvas></div>
    <div><h2>Tiled</h2><canvas id="pvTile" width="96" height="96"></canvas></div>
    <div><h2>Block</h2><canvas id="pvCube" width="120" height="112"></canvas></div>
    <div>
      <h2>Biome colours</h2>
      <div class="row"><label class="opt">Grass <input type="color" id="tGrass"></label><label class="opt">Leaves <input type="color" id="tFoliage"></label></div>
      <p class="hint" style="margin-top:6px">Grass and leaf textures are drawn in grey. The game multiplies them by these colours, and these colours are saved in the exported pack.</p>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
/* ---------- noise ---------- */

function xform(fn) { pushUndo(); const g = ctx(), id = g.getImageData(0, 0, cur.w, cur.h), out = g.createImageData(cur.w, cur.h); for (let y = 0; y < cur.h; y++) for (let x = 0; x < cur.w; x++) { const [sx, sy] = fn(x, y); const a = ((sy + cur.h) % cur.h * cur.w + (sx + cur.w) % cur.w) * 4, b = (y * cur.w + x) * 4; for (let k = 0; k < 4; k++) out.data[b + k] = id.data[a + k]; } g.putImageData(out, 0, 0); touched(); }
$('btnFlipH').onclick = () => xform((x, y) => [cur.w - 1 - x, y]); $('btnFlipV').onclick = () => xform((x, y) => [x, cur.h - 1 - y]);
$('btnL').onclick = () => xform((x, y) => [x + 1, y]); $('btnR').onclick = () => xform((x, y) => [x - 1, y]); $('btnU').onclick = () => xform((x, y) => [x, y + 1]); $('btnD').onclick = () => xform((x, y) => [x, y - 1]);
$('btnClear').onclick = () => { pushUndo(); ctx().clearRect(0, 0, cur.w, cur.h); touched(); };
$('btnReset').onclick = () => { pushUndo(); ctx().putImageData(cur.def, 0, 0); cur.mod = false; redrawThumb(cur); draw(); previews(); persist(); toast('Slot reset'); };
$('optTint').onchange = draw; $('optGuide').onchange = draw;

/* import / export */
async function loadInto(s, bmp, sx, sy, sw, sh) { pushUndo(); const g = s.canvas.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, s.w, s.h); g.drawImage(bmp, sx || 0, sy || 0, sw || bmp.width, sh || bmp.height, 0, 0, s.w, s.h); s.mod = true; redrawThumb(s); }
$('btnLoadSlot').onclick = () => $('fileSlot').click();
$('fileSlot').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const b = await createImageBitmap(f); await loadInto(cur, b, 0, 0, cur.skin ? b.width : b.width, cur.skin ? b.height : (cur.key === 'water_still' ? b.width : b.height)); draw(); previews(); persist(); } catch (er) { toast('That file is not a PNG image'); } e.target.value = ''; };
$('btnSaveSlot').onclick = () => cur.canvas.toBlob(b => download(b, (cur.tile ? cur.tile.name : cur.skin) + '.png'));
$('btnImport').onclick = () => $('fileImport').click();
const BLOCKMAP = {}; for (const t of TILES) { BLOCKMAP[t.name] = t.name; (t.alias || []).forEach(n => BLOCKMAP[n] = t.name); }
$('fileImport').onchange = async e => {
  const files = await expandFiles([...e.target.files]); let n = 0;
  for (const f of files) {
    if (/pack\.json$/i.test(f.name)) { try { const j = JSON.parse(await f.text()); if (j.tint) { Object.assign(tint, j.tint); $('tGrass').value = tint.grass; $('tFoliage').value = tint.foliage; } } catch (er) { } continue; }
    let b; try { b = await createImageBitmap(f); } catch (er) { continue; }
    const key = baseName(f);
    if (BLOCKMAP[key]) { const s = slots[BLOCKMAP[key]]; await loadInto(s, b, 0, 0, b.width, key === 'water_still' ? b.width : b.height); n++; }
    else if (slots['skin:' + key]) { const s = slots['skin:' + key], h = Math.round(b.width * s.h / s.w); await loadInto(s, b, 0, 0, b.width, Math.min(b.height, h)); n++; }
    else if (b.width === b.height && b.width >= 256 && b.width % 16 === 0) { const ts = b.width / 16; for (const t of TILES) if (CLASSIC[t.t] !== undefined) { const src = CLASSIC[t.t]; await loadInto(slots[t.name], b, (src % 16) * ts, Math.floor(src / 16) * ts, ts, ts); } n++; }
  }
  e.target.value = ''; toast(n ? n + ' file' + (n > 1 ? 's' : '') + ' imported' : 'No matching files. Use the names shown under each slot.'); buildList(); draw(); previews(); persist();
};
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
$('btnExport').onclick = async () => {
  const all = $('optAll').checked, entries = [], list = Object.values(slots).filter(s => all || s.mod);
  if (!list.length) return toast('Nothing changed yet. Edit a texture or tick "include unchanged".');
  for (const s of list) {
    const blob = await new Promise(r => s.canvas.toBlob(r, 'image/png')), data = new Uint8Array(await blob.arrayBuffer());
    entries.push({ name: (s.skin ? 'entity/' + s.skin : (s.cat === 'Blocks' ? 'blocks/' : 'items/') + s.tile.name) + '.png', data });
  }
  entries.push({ name: 'pack.json', data: new TextEncoder().encode(JSON.stringify({ game: 'Blockland', tint }, null, 2)) });
  download(makeZip(entries), 'blockland-pack.zip'); toast('Exported ' + list.length + ' textures');
};

/* ---------- previews ---------- */
const CUBE = { grass_top: ['grass_top', 'grass'], grass_side: ['grass_top', 'grass'], grass_side_overlay: ['grass_top', 'grass'], log_oak: ['log_oak_top', 'log_oak'], log_oak_top: ['log_oak_top', 'log_oak'], crafting_table_top: ['crafting_table_top', 'crafting_table_side'], crafting_table_side: ['crafting_table_top', 'crafting_table_side'], furnace_front_off: ['furnace_top', 'furnace_front_off'], furnace_top: ['furnace_top', 'furnace_front_off'] };
function faceCanvas(name) { // composited, tinted 16x16 face
  if (name === 'grass') { const c = mk(16, 16), g = c.getContext('2d'); g.drawImage(slots.grass_side.canvas, 0, 0); g.drawImage(tinted(slots.grass_side_overlay), 0, 0); return c; }
  const s = slots[name]; return s.tint ? tinted(s) : s.canvas;
}
function previews() {
  if (cur.skin) { for (const id of ['pvOne', 'pvTile', 'pvCube']) { const c = $(id); c.getContext('2d').clearRect(0, 0, c.width, c.height); } const g = $('pvOne').getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(cur.canvas, 0, 0, 96, Math.min(96, 96 * cur.h / cur.w)); return; }
  const one = $('pvOne').getContext('2d'), til = $('pvTile').getContext('2d'); one.imageSmoothingEnabled = til.imageSmoothingEnabled = false; one.clearRect(0, 0, 96, 96); til.clearRect(0, 0, 96, 96);
  const f = cur.key === 'grass_side_overlay' ? faceCanvas('grass') : cur.tint ? tinted(cur) : cur.canvas;
  one.drawImage(f, 0, 0, 96, 96); for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) til.drawImage(f, x * 32, y * 32, 32, 32);
  const cg2 = $('pvCube').getContext('2d'); cg2.imageSmoothingEnabled = false; cg2.clearRect(0, 0, 120, 112);
  const m = CUBE[cur.key] || [cur.key, cur.key], top = faceCanvas(m[0] === 'grass_top' ? 'grass_top' : m[0]), side = faceCanvas(m[1]), k = 3, cx = 60, yt = 6;
  const face = (img, a, b, c, d, e, f2, shade) => { cg2.save(); cg2.setTransform(a, b, c, d, e, f2); cg2.drawImage(img, 0, 0); if (shade) { cg2.fillStyle = 'rgba(0,0,0,' + shade + ')'; cg2.fillRect(0, 0, 16, 16); } cg2.restore(); };
  face(top, k, k * .5, -k, k * .5, cx, yt, 0); face(side, k, k * .5, 0, k, cx - 16 * k, yt + 8 * k, 0.28); face(side, k, -k * .5, 0, k, cx, yt + 16 * k, 0.45);
}
$('tGrass').oninput = e => { tint.grass = e.target.value; draw(); previews(); persist(); };
$('tFoliage').oninput = e => { tint.foliage = e.target.value; draw(); previews(); persist(); };
$('tGrass').value = tint.grass; $('tFoliage').value = tint.foliage;
window.addEventListener('resize', () => { layout(); draw(); });
drawSwatches(); setTab('Blocks');

</script>
</body>
